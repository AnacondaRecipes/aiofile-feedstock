{% set name = "aiofile" %}
{% set version = "3.9.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: e5ad718bb148b265b6df1b3752c4d1d83024b93da9bd599df74b9d9ffcf7919b
  # use .get() instead of [] for metadata in version.py. square brackets will throw a KeyError for missing
  # keys access on newer python or if importlib_metadata is present. due to lack of optional metadata fields
  # like Home-page, this can break downstream packages without the patch.
  patches:
    - use_get_for_metadata.patch

build:
  number: 1
  skip: true  # [py<38]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv

requirements:
  host:
    - pip
    - python
    - poetry-core >=1
  run:
    # Conda version of ~=0.9.0
    - caio >=0.9.0,<10
    - python

# no project tests available in pypi, and no GH release for version 3.9.0
test:
  imports:
    - aiofile
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # exercises import with importlib_metadata. it confirms use_get_for_metadata patch works, and will fail otherwise.
    - python -c "import importlib_metadata; import aiofile"
  requires:
    - pip
    - importlib_metadata # used for testing use_get_for_metadata patch

about:
  home: https://github.com/mosquito/aiofile
  summary: Asynchronous file operations.
  description: Real asynchronous file operations with asyncio support.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENCE.md
  dev_url: https://github.com/mosquito/aiofile
  doc_url: https://github.com/mosquito/aiofile

extra:
  recipe-maintainers:
    - BastianZim
